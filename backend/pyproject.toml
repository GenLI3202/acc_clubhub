[tool.poetry]
name = "acc-clubhub-backend"
version = "0.4.3"
description = "ACC (Across Cycling Club Munich) Backend - Event Registration System"
authors = ["ACC ClubHub Team"]
# readme = "README.md"  # Commented out - file doesn't exist yet
# packages = [{include = "."}]  # Removed - not a package, just an application

[tool.poetry.dependencies]
python = "^3.14"

# Web Framework
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}

# Database
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"

# Validation & Settings
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"

# Authentication (JWT for Supabase)
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.6"

# HTTP Client & Email
httpx = "^0.25.1"
resend = "^0.8.0"

# Utilities
python-frontmatter = "^1.1.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^7.0.0"

# Code Quality
ruff = "^0.15.0"
mypy = "^1.19.1"

# Development
black = "^24.0.0"
ipython = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
